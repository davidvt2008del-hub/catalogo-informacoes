services:
  - type: web
    name: catalogo-administracao-miguel
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/davidvt2008del-hub/catalogo-informacoes
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: catalogo-administracao-dados
          property: connectionString
